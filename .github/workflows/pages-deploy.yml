name: Deploy to GitHub Pages

# NOTE: GitHub Pages can only host STATIC files (HTML, CSS, JS)
# It CANNOT run Node.js servers or backend APIs
# For full functionality, deploy to Vercel, Railway, or use Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create static build directory
        run: |
          mkdir -p build
          # Copy frontend HTML files from root
          cp index.html build/ 2>/dev/null || true
          cp live.html build/ 2>/dev/null || true
          cp README.md build/ 2>/dev/null || true
          echo "⚠️ Note: This is a static deployment. Backend APIs are not available." > build/DEPLOYMENT_INFO.txt
          echo "For full functionality, deploy to Vercel, Render, or use Docker." >> build/DEPLOYMENT_INFO.txt
          
      - name: Create .nojekyll
        run: touch build/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
