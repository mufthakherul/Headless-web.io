<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headless-web - AI Chat</title>
    <meta name="description" content="Chat with multiple AI providers - Gemini, GPT, Grok, DeepSeek, Copilot">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-main: #ffffff;
            --bg-secondary: #f3f4f6;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.1);
            --message-user: #667eea;
            --message-assistant: #f3f4f6;
        }

        [data-theme="dark"] {
            --bg-main: #1f2937;
            --bg-secondary: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #374151;
            --shadow: rgba(0, 0, 0, 0.3);
            --message-assistant: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .header-nav a:hover {
            opacity: 0.8;
        }

        .logout-btn,
        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .logout-btn:hover,
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: calc(100vh - 140px);
        }

        .sidebar {
            background: var(--bg-main);
            border-radius: 12px;
            box-shadow: 0 4px 6px var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h3 {
            color: var(--text-primary);
            font-size: 16px;
            margin-bottom: 15px;
        }

        .provider-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .provider-btn {
            padding: 12px;
            border: 2px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            text-align: left;
            font-size: 13px;
        }

        .provider-btn:hover {
            border-color: var(--primary);
            background: var(--bg-main);
        }

        .provider-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .provider-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sidebar-body {
            flex: 1;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .chat-session {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-session:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .chat-session.active {
            background: var(--primary);
            color: white;
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            background: var(--error);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 12px;
        }

        .clear-btn:hover {
            opacity: 0.9;
        }

        .main-chat {
            background: var(--bg-main);
            border-radius: 12px;
            box-shadow: 0 4px 6px var(--shadow);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            color: var(--text-primary);
        }

        .model-selector {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.assistant .message-content {
            background: var(--message-assistant);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .message.user .message-content {
            background: var(--primary);
            color: white;
        }

        .message-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-secondary);
            resize: none;
            max-height: 100px;
            font-family: inherit;
            transition: all 0.2s;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-main);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .send-btn {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 15px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
        }

        .token-usage {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .sidebar {
                max-height: 200px;
            }

            .message-content {
                max-width: 90%;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <a href="/" class="logo">
                <span>🌐</span> Headless-web
            </a>
        </div>
        <div class="header-nav">
            <a href="/">Browse</a>
            <a href="/downloader.html">Download</a>
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span>
            </button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>AI Providers</h3>
                <div class="provider-selector" id="providers"></div>
            </div>

            <div class="sidebar-body" id="sessions"></div>

            <div class="sidebar-footer">
                <button class="clear-btn" onclick="clearHistory()">Clear History</button>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="main-chat">
            <div class="chat-header">
                <h2 class="chat-title" id="chat-title">💬 AI Chat</h2>
                <select class="model-selector" id="model-selector">
                    <option>Select Model...</option>
                </select>
            </div>

            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <div>Select an AI provider to start chatting</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea class="message-input" id="message-input" placeholder="Type your message..." rows="1"
                        disabled></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
                        <span class="btn-text">→</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentProvider = null;
        let currentModel = null;
        let currentSessionId = null;
        let messageHistory = [];
        let providers = {};

        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('theme-icon').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // Load saved theme
        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
            loadProviders();
        });

        // Load available providers
        async function loadProviders() {
            try {
                const response = await fetch('/ai/providers');
                const data = await response.json();

                if (data.success) {
                    providers = {};
                    const container = document.getElementById('providers');
                    container.innerHTML = '';

                    let defaultProvider = null;
                    let hasAvailableProviders = false;

                    data.providers.forEach(provider => {
                        if (provider.available) {
                            hasAvailableProviders = true;
                            providers[provider.id] = provider.models;

                            const btn = document.createElement('button');
                            btn.className = 'provider-btn';
                            btn.textContent = provider.name.toUpperCase();
                            btn.setAttribute('data-provider-id', provider.id);
                            btn.onclick = () => selectProvider(provider.id, provider.models, provider.name);
                            container.appendChild(btn);

                            // Track default provider (Gemini)
                            if (provider.default) {
                                defaultProvider = { id: provider.id, models: provider.models, name: provider.name };
                            }
                        }
                    });

                    // Auto-select default provider if available
                    if (defaultProvider) {
                        setTimeout(() => {
                            const btn = container.querySelector(`[data-provider-id="${defaultProvider.id}"]`);
                            if (btn) {
                                btn.click();
                            }
                        }, 100);
                    }

                    // Show message if no providers available
                    if (!hasAvailableProviders) {
                        container.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--text-secondary);">⚠️ No AI providers configured.<br>Please add API keys in .env file.</div>';
                    }
                }
            } catch (error) {
                console.error('Failed to load providers:', error);
                const container = document.getElementById('providers');
                container.innerHTML = '<div style="padding: 15px; text-align: center; color: var(--error);">❌ Failed to load providers.<br>Please refresh the page.</div>';
            }
        }

        // Select provider
        function selectProvider(providerId, models, displayName) {
            currentProvider = providerId;
            currentSessionId = `session_${Date.now()}`;
            messageHistory = [];

            // Update UI
            document.querySelectorAll('.provider-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`[data-provider-id="${providerId}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }

            // Update model selector
            const modelSelector = document.getElementById('model-selector');
            modelSelector.innerHTML = '';
            models.forEach((model, index) => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                if (index === 0) {
                    option.selected = true;
                }
                modelSelector.appendChild(option);
            });
            modelSelector.onchange = (e) => currentModel = e.target.value;
            currentModel = models[0];

            // Clear messages and enable input
            const messagesEl = document.getElementById('messages');
            messagesEl.innerHTML = '';

            document.getElementById('chat-title').textContent = `💬 ${displayName}`;
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            
            // Focus on input
            document.getElementById('message-input').focus();
        }

        // Send message
        async function sendMessage() {
            if (!currentProvider || !currentModel) return;

            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            // Add user message to UI
            addMessageToUI(message, 'user');
            input.value = '';
            messageHistory.push({ role: 'user', content: message });

            // Send to API
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;
            sendBtn.textContent = '⏳';

            try {
                const response = await fetch('/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: currentProvider,
                        message,
                        model: currentModel,
                        history: messageHistory,
                        sessionId: currentSessionId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    addMessageToUI(data.response, 'assistant', data.usage?.tokens);
                    messageHistory.push({ role: 'assistant', content: data.response });
                } else {
                    addMessageToUI('Error: ' + (data.error || 'Failed to get response'), 'assistant');
                }
            } catch (error) {
                addMessageToUI('Network error: ' + error.message, 'assistant');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '→';
            }
        }

        // Add message to UI
        function addMessageToUI(text, role, tokens = null) {
            const messagesEl = document.getElementById('messages');

            if (messagesEl.querySelector('.empty-state')) {
                messagesEl.innerHTML = '';
            }

            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;

            const contentEl = document.createElement('div');
            contentEl.className = 'message-content';
            contentEl.textContent = text;

            messageEl.appendChild(contentEl);

            if (role === 'assistant' && tokens) {
                const metaEl = document.createElement('div');
                metaEl.className = 'token-usage';
                metaEl.textContent = `Tokens: ${tokens}`;
                messageEl.appendChild(metaEl);
            }

            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // Clear history
        function clearHistory() {
            if (!currentSessionId) return;

            fetch('/ai/history', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: currentSessionId })
            });

            messageHistory = [];
            document.getElementById('messages').innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div>Chat cleared</div></div>';
        }

        // Logout
        function logout() {
            fetch('/auth/logout', { method: 'POST' });
            localStorage.removeItem('token');
            localStorage.removeItem('sessionId');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }

        // Handle Enter key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>

</html>
